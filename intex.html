<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>projects</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: white;
            width: 100vw;
            height: 100vh;
            cursor: pointer;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        // 20개의 링크 - 여기를 수정하세요!
        const links = [
            'https://baesunyoung.com/f002',
            'https://example2.com',
            'https://example3.com',
            'https://example4.com',
            'https://example5.com',
            'https://example6.com',
            'https://example7.com',
            'https://example8.com',
            'https://example9.com',
            'https://example10.com',
            'https://example11.com',
            'https://example12.com',
            'https://example13.com',
            'https://example14.com',
            'https://example15.com',
            'https://example16.com',
            'https://example17.com',
            'https://example18.com',
            'https://example19.com',
            'https://example20.com'
        ];
        
        // 삼각형 클래스
        class Triangle {
            constructor(link) {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = 12;
                this.speedX = (Math.random() - 0.5) * 1;
                this.speedY = (Math.random() - 0.5) * 1;
                this.rotation = Math.random() * Math.PI * 2;
                this.rotationSpeed = (Math.random() - 0.5) * 0.02;
                this.link = link;
            }
            
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.rotation += this.rotationSpeed;
                
                // 화면 경계 처리
                if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
                if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
                
                this.x = Math.max(0, Math.min(canvas.width, this.x));
                this.y = Math.max(0, Math.min(canvas.height, this.y));
            }
            
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                
                ctx.beginPath();
                ctx.moveTo(0, -this.size);
                ctx.lineTo(-this.size * 0.866, this.size * 0.5);
                ctx.lineTo(this.size * 0.866, this.size * 0.5);
                ctx.closePath();
                ctx.strokeStyle = 'black';
                ctx.lineWidth = 1;
                ctx.stroke();
                
                ctx.restore();
            }
        }
        
        // 원 클래스
        class Circle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.radius = 30 + Math.random() * 50;
            }
            
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = 'white';
                ctx.fill();
            }
            
            contains(x, y) {
                const dx = x - this.x;
                const dy = y - this.y;
                return dx * dx + dy * dy < this.radius * this.radius;
            }
        }
        
        // 삼각형 20개 생성 (각각 다른 링크)
        const triangles = [];
        for (let i = 0; i < 20; i++) {
            triangles.push(new Triangle(links[i]));
        }
        
        // 원 5~8개 생성
        const circles = [];
        const circleCount = 5 + Math.floor(Math.random() * 4);
        for (let i = 0; i < circleCount; i++) {
            circles.push(new Circle());
        }
        
        function animate() {
            // 배경 그리기
            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 원 그리기
            circles.forEach(circle => circle.draw());
            
            // 삼각형 업데이트 및 그리기
            triangles.forEach(triangle => {
                triangle.update();
                
                // 원 안에 있는지 확인
                let isInCircle = false;
                for (let circle of circles) {
                    if (circle.contains(triangle.x, triangle.y)) {
                        isInCircle = true;
                        break;
                    }
                }
                
                // 원 밖에 있을 때만 그리기
                if (!isInCircle) {
                    triangle.draw();
                }
            });
            
            requestAnimationFrame(animate);
        }
        
        animate();
        
        // 클릭 이벤트 처리
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;
            
            // 클릭한 위치에 삼각형이 있는지 확인
            for (let triangle of triangles) {
                // 원 안에 있으면 클릭 불가
                let isInCircle = false;
                for (let circle of circles) {
                    if (circle.contains(triangle.x, triangle.y)) {
                        isInCircle = true;
                        break;
                    }
                }
                
                if (isInCircle) continue;
                
                // 삼각형과의 거리 계산 (대략적인 클릭 영역)
                const dx = clickX - triangle.x;
                const dy = clickY - triangle.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                
                if (distance < triangle.size * 2) {
                    window.open(triangle.link, '_blank');
                    break;
                }
            }
        });
        
        // 창 크기 변경 시 캔버스 크기 조정
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
